<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#1e293b"/>

  <!-- Calendar icon -->
  <g transform="translate(96, 80)">
    <!-- Calendar body -->
    <rect x="32" y="64" width="256" height="256" rx="24" fill="#334155"/>

    <!-- Calendar top bar -->
    <rect x="32" y="64" width="256" height="64" rx="24" fill="url(#grad)"/>
    <rect x="32" y="104" width="256" height="24" fill="url(#grad)"/>

    <!-- Calendar rings -->
    <rect x="72" y="32" width="24" height="56" rx="12" fill="#94a3b8"/>
    <rect x="204" y="32" width="24" height="56" rx="12" fill="#94a3b8"/>

    <!-- Checkmark -->
    <path d="M112 200 L168 256 L240 160" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>